name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2

      - name: Check CHANGELOG matches tag
        run: bash scripts/pre-release-check.sh "${GITHUB_REF_NAME#v}"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Test
        run: just test

      - name: Extract release notes
        run: |
          awk 'found && /^## /{exit} /^## \[/{found=1; next} found{print}' CHANGELOG.md \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Could not extract release notes from CHANGELOG.md"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*

      - name: Publish to PyPI
        # Requires UV_PUBLISH_TOKEN secret configured with PyPI API token
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
